spring.application.name=money-manager

# Database Configuration (Neon PostgreSQL Cloud)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Brevo HTTP API Configuration (Render Port Block Bypass)
brevo.api.key=${MAIL_PASSWORD}
brevo.sender.email=${MAIL_FROM}
brevo.sender.name=SmartVault

money.manager.frontend.url=${FRONTEND_URL}
app.backend.url=${BACKEND_URL}

# Colored Output Console Enable
spring.output.ansi.enabled=ALWAYS
spring.main.banner-mode=console